[package]
name = "smtp-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SMTP server for near.email - encrypts incoming emails for NEAR accounts"

[[bin]]
name = "smtp-server"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# SMTP server
# 0.8 and later accept connections concurrently. In 0.7.1 the accept loop sat OUTSIDE
# `pool.scoped(...)`, and scoped_threadpool joins on scope drop — so exactly one connection was
# served at a time regardless of pool size, and with the crate's five-minute socket read timeout a
# single stalled client blocked all inbound mail. Do not pin back to 0.7.
mailin-embedded = { version = "0.8.3", features = ["rtls"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Cryptography
secp256k1 = { version = "0.29", features = ["global-context"] }
ecies = "0.2"
sha2 = "0.10"
hex = "0.4"

# Email parsing
mail-parser = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for db-api
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.21"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
